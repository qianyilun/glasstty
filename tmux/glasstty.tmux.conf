# glasstty tab bar for tmux. https://github.com/qianyilun/glasstty
#
# Load it from ~/.tmux.conf with:
#   source-file ~/path/to/glasstty/tmux/glasstty.tmux.conf
#
# glasstty.glsl draws every span with background colour204 as a clear glass capsule and
# colour200 as the blue current tab. A capsule is 30pt tall, taller than one row, so the
# status bar gets a blank second line to extend into, and it sits at the top where the window
# padding takes the rest. Keep two spaces on each side inside a colored span: they are the
# capsule padding.
set -g status-position top
set -g status 2
set -g status-format[1] ""
set -g status-style "bg=default,fg=#1d1d1f"
set -g status-left-length 32
set -g status-right-length 60
set -g status-left "#[bg=colour204,fg=#1d1d1f,bold]  #S  #[bg=default,fg=default,nobold]  "
set -g status-right "#[bg=default,fg=#605f64]%H:%M "
setw -g window-status-separator "  "
setw -g window-status-format "#[bg=colour204,fg=#1d1d1f,bold]  #I: #W  #[bg=default,nobold]"
setw -g window-status-current-format "#[bg=colour200,fg=#ffffff,bold]  #I: #W  #[bg=default,nobold]"
